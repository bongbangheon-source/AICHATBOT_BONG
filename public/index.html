<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>봉미나이 · AI와 나누는 대화</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <div class="app">
    <header><a class="brand" href="/">✳ <span>봉미나이</span></a><button id="reset" type="button">＋ 새 대화</button></header>
    <main>
      <div class="topline"><span><i></i> GPT-4o mini</span><span>작은 질문, 새로운 생각</span></div>
      <section id="welcome" class="welcome">
        <div class="spark">✳</div><p class="eyebrow">YOUR EVERYDAY AI</p>
        <h1>어떤 생각을<br>함께 나눠 볼까요?</h1>
        <p>궁금한 것부터 떠오르는 아이디어까지.<br>앞서 나눈 이야기를 기억하며 함께 생각해요.</p>
        <div class="suggestions">
          <button type="button" data-prompt="JavaScript의 비동기 처리를 쉬운 예시로 설명해 줘."><span>⌘</span>개념 쉽게 이해하기<small>JavaScript 비동기 처리 알아보기 ↗</small></button>
          <button type="button" data-prompt="공부에 집중하기 위한 현실적인 하루 계획을 함께 세워 줘."><span>☀</span>하루 계획 세우기<small>작은 습관으로 시작하는 하루 ↗</small></button>
          <button type="button" data-prompt="주말에 할 수 있는 창의적인 취미 아이디어 5개를 추천해 줘."><span>✧</span>아이디어 발견하기<small>새로운 영감이 필요할 때 ↗</small></button>
        </div>
      </section>
      <section id="messages" class="messages" aria-label="대화 내용" role="log" aria-live="polite"></section>
    </main>
    <footer>
      <p id="status" role="status"></p>
      <form id="chat-form"><label class="sr-only" for="input">메시지</label><textarea id="input" rows="1" maxlength="6000" placeholder="무엇이든 물어보세요…" required></textarea><button id="send" type="submit" aria-label="메시지 보내기">↑</button></form>
      <p class="note">Enter로 전송 · Shift + Enter로 줄바꿈 <span>AI의 답변은 정확하지 않을 수 있습니다.</span></p>
    </footer>
  </div>
</body>
</html>
